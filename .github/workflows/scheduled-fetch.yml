name: Scheduled Article Fetch

on:
  schedule:
    # 毎日 UTC 0:00, 6:00, 12:00, 18:00 (JST 9:00, 15:00, 21:00, 3:00)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  fetch-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger article fetch (with retry)
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=60

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Attempt $attempt / $MAX_RETRIES ==="

            # TEST: 意図的に失敗させてmonitor-fetchをテスト（後で戻す）
            response=$(curl -s -L -w "\n%{http_code}" --max-time 10 -X POST \
              -H "Authorization: Bearer wrong_token_for_test" \
              "${{ secrets.SITE_URL }}/api/cron") || true

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            echo "HTTP Status: $http_code"
            echo "$body" | python3 -m json.tool || echo "$body"

            if [ "$http_code" = "200" ]; then
              echo "::notice::Fetch succeeded on attempt $attempt"
              exit 0
            fi

            echo "::warning::Attempt $attempt failed with status $http_code"

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

          echo "::error::Fetch failed after $MAX_RETRIES attempts (last status: $http_code)"
          exit 1
