name: Monitor & Fix Fetch Failures

on:
  workflow_run:
    workflows: ["Scheduled Article Fetch"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  analyze-and-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch failed run logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          RUN_URL=${{ github.event.workflow_run.html_url }}

          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          # 失敗したジョブのログを取得
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -100 > /tmp/failed_logs.txt || true

          # GITHUB_OUTPUT に保存（multiline）
          {
            echo "logs<<LOGS_EOF"
            cat /tmp/failed_logs.txt
            echo "LOGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Analyze and fix with Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            ## タスク: scheduled-fetch ワークフロー失敗の自動分析・修正

            ### 失敗ログ
            ```
            ${{ steps.logs.outputs.logs }}
            ```

            ワークフロー実行URL: ${{ steps.logs.outputs.run_url }}

            ### 指示

            1. **原因分析**: 上記のログから失敗の根本原因を特定してください
            2. **コード確認**: 関連するコードを確認してください
               - src/app/api/cron/route.ts（cronエンドポイント）
               - src/lib/fetchers/（RSS/APIフェッチャー）
               - src/lib/gemini.ts（Gemini要約API連携）
               - src/lib/fetchers/sources.ts（ソース定義）
            3. **修正**: コードの修正で解決できる場合は修正してください
               - 修正する場合は新しいブランチを作成してコミットし、developブランチへのPRを作成してください
               - ブランチ名: fix/auto-fetch-$(date +%Y%m%d-%H%M)
               - コミットメッセージはConventional Commits形式で
            4. **修正不要の場合**: 一時的なエラー（ネットワーク障害等）でコード修正が不要な場合は、修正せずレポートのみ出力してください

            ### 原因分析の観点
            - HTTP 5xx → Cloudflare Worker側の問題（コード/設定）
            - HTTP 401 → CRON_SECRET の不一致や期限切れ
            - タイムアウト → 記事数過多やレート制限
            - Gemini API エラー → APIキーやレート制限
            - RSSパースエラー → ソース側のフォーマット変更
            - D1エラー → DBスキーマ不整合やクォータ超過

            ### 重要な制約
            - Edge Runtime互換のコードのみ使用すること
            - 既存のテストが壊れないようにすること
            - console.logをコードに残さないこと

            ### レポート出力
            分析結果を以下のフォーマットで **必ず最後に** 出力してください:

            === FETCH_MONITOR_REPORT ===
            日時: (ISO8601)
            原因: (1-2行で簡潔に)
            カテゴリ: (一時的エラー|コードバグ|外部サービス障害|設定問題|RSSソース変更)
            深刻度: (低|中|高)
            修正: (修正内容の要約、または「修正不要」)
            PR: (作成したPR URL、または「なし」)
            推奨アクション: (オーナーに求めるアクション、または「不要」)
            === END_REPORT ===

      - name: Extract report
        id: report
        shell: bash
        env:
          CLAUDE_RESULT: ${{ steps.claude.outputs.result }}
        run: |
          # Claude出力からレポートを抽出
          REPORT=""

          # 1. steps.claude.outputs.result から抽出
          if [ -n "$CLAUDE_RESULT" ]; then
            REPORT=$(echo "$CLAUDE_RESULT" | sed -n '/=== FETCH_MONITOR_REPORT ===/,/=== END_REPORT ===/p')
            if [ -z "$REPORT" ]; then
              REPORT=$(echo "$CLAUDE_RESULT" | head -c 1000)
            fi
          fi

          # 2. 出力JSONファイルからフォールバック抽出
          if [ -z "$REPORT" ] && [ -f /home/runner/work/_temp/claude-execution-output.json ]; then
            REPORT=$(cat /home/runner/work/_temp/claude-execution-output.json | python3 -c "
import sys, json
data = json.load(sys.stdin)
for msg in reversed(data) if isinstance(data, list) else [data]:
    if isinstance(msg, dict):
        content = msg.get('content', '') or msg.get('result', '') or msg.get('text', '')
        if isinstance(content, list):
            for c in content:
                if isinstance(c, dict) and c.get('type') == 'text':
                    text = c.get('text', '')
                    if 'FETCH_MONITOR_REPORT' in text:
                        start = text.find('=== FETCH_MONITOR_REPORT ===')
                        end = text.find('=== END_REPORT ===')
                        if start >= 0 and end >= 0:
                            print(text[start:end + len('=== END_REPORT ===')])
                            sys.exit(0)
                    elif len(text) > 50:
                        print(text[:1000])
                        sys.exit(0)
        elif isinstance(content, str) and len(content) > 50:
            print(content[:1000])
            sys.exit(0)
" 2>/dev/null) || true
          fi

          if [ -z "$REPORT" ]; then
            REPORT="Claude分析の出力を取得できませんでした。GitHub Actionsログを確認してください。"
          fi

          {
            echo "report<<REPORT_EOF"
            echo "$REPORT"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email report
        if: ${{ env.HAS_SMTP == 'true' }}
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' && 'true' || 'false' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[ClaudeNote] 記事フェッチ失敗レポート"
          html_body: |
            <h2>ClaudeNote 自動フェッチ監視レポート</h2>
            <hr>
            <p><strong>実行日時:</strong> ${{ github.event.workflow_run.run_started_at }}</p>
            <p><strong>ワークフロー:</strong> <a href="${{ steps.logs.outputs.run_url }}">GitHub Actions ログ</a></p>
            <hr>
            <pre>${{ steps.report.outputs.report }}</pre>
            <hr>
            <p><small>このメールはGitHub Actionsから自動送信されています。</small></p>
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "ClaudeNote Monitor"
